<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOW PLAYERを開く</title><style>body{margin:0;background:#f3f0e8;color:#202e3a;font:16px/1.7 -apple-system,sans-serif}main{max-width:540px;margin:60px auto;padding:25px}h1{font-size:28px}p{color:#3d4b57}a,button{display:block;width:100%;box-sizing:border-box;background:#167b86;color:#ffffff;padding:16px;border:0;border-radius:12px;text-align:center;font:inherit;font-weight:bold;text-decoration:none;margin:18px 0}small{color:#5d6a74}</style></head><body><main><small>SHOW PLAYER · 起動用ページ</small><h1>SHOW PLAYERを開く</h1><p>通常の入口でエラーが出る場合は、こちらから開いてください。保存した音源や設定は削除しません。</p><a id="open" href="app.html">アプリを開く →</a><p id="status">初回はネット接続をオンにしてください。</p><small>まだ開けない場合は、このリンクをSafariでも試してください。通常のブラウザから開くだけで利用できます。</small></main><script>
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).then(()=>{document.getElementById('status').textContent='読み込み処理を更新しました。「アプリを開く」を押してください。';}).catch(()=>{document.getElementById('status').textContent='「アプリを開く」から試してください。更新できない場合はネット接続も確認してください。';});}
</script></body></html>
