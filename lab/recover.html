<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOW PLAYERを開く</title><style>body{margin:0;background:#f3f0e8;color:#202e3a;font:16px/1.7 -apple-system,sans-serif}main{max-width:540px;margin:60px auto;padding:25px}h1{font-size:28px}p{color:#3d4b57}a,button{display:block;width:100%;box-sizing:border-box;background:#167b86;color:#ffffff;padding:16px;border:0;border-radius:12px;text-align:center;font:inherit;font-weight:bold;text-decoration:none;margin:18px 0}small{color:#5d6a74}</style></head><body><main><small>SHOW PLAYER · 1.1.0 · 更新用ページ</small><h1>SHOW PLAYERを開く</h1><p>通常の入口でエラーが出る場合は、こちらから開いてください。保存した音源や設定は削除しません。</p><a id="open" href="releases/v146/index.html">アプリを開く →</a><p id="status">初回はネット接続をオンにしてください。</p><small>まだ開けない場合は、このリンクをSafariでも試してください。通常のブラウザから開くだけで利用できます。</small></main><script>
const link=document.getElementById('open'),status=document.getElementById('status');
link.removeAttribute('href');link.style.opacity='.5';link.textContent='更新を確認中…';
(async()=>{
 try{
  if('serviceWorker'in navigator){
   const r=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await r.update();
   const worker=r.installing||r.waiting;
   if(worker&&worker.state!=='activated')await new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>reject(Error('更新待ち')),20000);
    const check=()=>{if(worker.state==='activated'){clearTimeout(timeout);resolve();}else if(worker.state==='redundant'){clearTimeout(timeout);reject(Error('更新に失敗'));}};
    worker.addEventListener('statechange',check);check();
   });
  }
  status.textContent='更新しました。アプリで「WEB 1.1.0」と表示されることを確認してください。';
 }catch(e){status.textContent='更新を完了できませんでした。ネット接続を確認し、このページを再読み込みしてください。';}
 link.href='releases/v146/index.html';link.style.opacity='1';link.textContent='アプリを開く →';
})();
</script></body></html>
