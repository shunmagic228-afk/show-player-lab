<!doctype html><html lang="ja"><head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f6fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>SHOW PLAYER</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="player.css?v=145"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"></head><body><main>
<header class="top"><div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#23a0ac"/><stop offset="1" stop-color="#115f69"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lg)"/><path d="M19 14.5v19a1.2 1.2 0 0 0 1.8 1l15.5-9.5a1.2 1.2 0 0 0 0-2L20.800 13.500a1.200 1.200 0 0 0-1.800 1z" fill="#f3f0e8"/></svg><b>SHOW PLAYER</b></div><span class="pill version">1.1.0</span></header>

<div id="sideList" class="side-list panel"><div class="side-head"><label class="panel-title" for="listPicker">セットリスト</label></div><div class="side-pick"><select id="listPicker" class="list-picker"></select><button id="listMenu" class="icon-btn" type="button" aria-label="セットリストの管理（新規・複製・削除）" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 13.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V19a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H5a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V5a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H19a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button></div>
<p id="listVersion" class="small muted"></p>
<div class="library-actions"><button id="newList" class="secondary">＋ 新規</button><button id="duplicateList" class="secondary">複製</button><button id="deleteList" class="text-danger">削除</button></div>
</div>
</aside><div class="workspace"><div id="engineNote" class="banner" hidden></div><div class="status-row"><div id="offlineStatus" class="banner" role="status">オフライン準備を確認しています…</div><div id="notice" class="notice" role="status">音源を追加して始めてください。</div></div>
<section id="live" class="live-player"><div class="live-main"><div class="np-card"><div class="preparation" aria-label="本番前の準備"><span id="prepSaved">○ 音源・設定保存</span><span id="prepOffline">○ 画面のオフライン保存</span><span id="prepRemote">○ GO準備</span></div>
<div class="title-row"><span id="number" class="eyebrow">00 / 00</span><span id="state" class="pill">音源なし</span></div>
<h1 id="title">音源を選んでください</h1>
<input id="seek" class="seek-slider" type="range" min="0" max="0" step="0.01" value="0" aria-label="再生位置" disabled><p id="seekHint" class="small muted"></p><div class="progress" hidden><div id="progressBar"></div></div><div class="times"><span id="position">0:00</span><span id="duration">0:00</span></div>
<div class="transport"><button id="previous" class="skip" aria-label="曲頭・前曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.4v14H6zM19 5v14L9 12z"/></svg></button><button id="central" class="central" aria-label="再生・一時停止">▶</button><button id="next" class="skip" aria-label="フェードアウト・次曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 5H18v14h-2.4zM5 5v14l10-7z"/></svg></button></div>
<div class="hint"><b id="nextHint">右：再生を開始</b><p id="fadeStatus"></p></div>
<div class="action-row"><button id="stop" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.4"/></svg>停止して曲頭へ</button><button id="go" class="primary">GO · 音を出さずに準備</button></div>
<div class="remote-row"><button id="releaseRemote" class="text-button">リモコン準備を解除</button><span id="remoteStatus" class="small muted"></span></div></div>
<div class="next-card"><div class="next-label">NEXT</div><p id="nextTitle" class="next-title">次の曲：—</p><p id="nextMeta" class="next-meta"></p></div>
<div id="selectionPanel" class="panel" hidden><p class="eyebrow">次に開始する曲</p><h2 id="selectedTitle"></h2><div class="selection-actions"><button id="activateSelected" class="primary">選んだ曲を再生 →</button><button id="cancelSelected" class="text-button">選択を解除</button></div></div></div>
<div class="sl-card"><div class="section-heading"><h2>セットリスト</h2><span id="saveStatus" class="small muted">未保存</span></div><button id="audioCheck" class="secondary">保存済み音源をチェック</button><div id="trackList"></div></div>
</section>
<section id="edit" hidden><div class="edit-title"><h2>音源と曲ごとの設定</h2><a class="manual-link" href="manual.html" target="_blank" rel="noopener">使い方マニュアル</a></div><div id="editorSaveStatus" class="banner" role="status">保存状態を確認しています…</div><label class="panel-title" for="listName">セットリスト名</label><input id="listName" class="name-input" type="text" placeholder="ショー名">
<div id="audioDropZone" class="audio-drop-zone" role="region" aria-label="音源ファイルの取り込み"><p><b>音源をここへドロップ</b></p><label class="primary file-label">＋ 音源を追加<input id="files" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.aif,.aiff" multiple hidden></label></div><p id="importStatus" class="small muted"></p><div class="reuse-row"><select id="reusePicker" aria-label="保存済み音源を選択"></select><button id="reuseAdd" class="secondary">保存済み音源を追加</button></div>
<div class="order-panel"><h2>曲順</h2><div id="orderList"></div><p id="orderStatus" class="small muted" role="status"></p></div><div id="editList"></div>
<div class="edit-save"><button id="save" class="primary">設定を保存する</button><button id="back" class="secondary">保存して本番画面へ戻る</button><button id="testUnsaved" class="text-button">保存せず本番画面でテスト</button></div></section>
<section id="share" hidden><div class="edit-title"><h2>プレイリスト共有</h2></div>
<div class="panel share-card"><h3 class="share-h">ZIPで書き出す</h3><label class="panel-title" for="shareList">プレイリスト</label><select id="shareList" class="list-picker"></select><p id="shareInfo" class="small muted"></p><button id="shareExport" class="primary">ZIPで書き出す</button><progress id="shareExportBar" max="1" value="0" hidden></progress><p id="shareExportStatus" class="small muted" role="status"></p><button id="shareSave" class="secondary" hidden></button></div>
<div class="panel share-card"><h3 class="share-h">ZIPから読み込む</h3><div id="shareDrop" class="audio-drop-zone share-drop"><p><b>ZIPをここへドロップ</b></p><label class="primary file-label">ZIPから読み込む<input id="shareFile" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden></label></div><progress id="shareImportBar" max="1" value="0" hidden></progress><p id="shareImportStatus" class="small muted" role="status"></p></div>
</section>
<footer>SHOW PLAYER · 1.1.0</footer>
</div></div><audio id="audio" preload="auto" playsinline></audio><audio id="receiver" src="receiver-silence.wav" preload="auto" loop playsinline></audio>
